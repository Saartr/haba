apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  compileSdkVersion 36
  namespace "pro.mihmih.haba.yandexid"
  defaultConfig {
    minSdkVersion 26
    targetSdkVersion 36
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Яндекс ID LoginSDK лежит в mavenCentral — отдельный репозиторий не нужен
  // (в отличие от VK ID, которому требуются зеркала vkpartner.ru).
  implementation "com.yandex.android:authsdk:3.1.3"
  implementation project(':expo-modules-core')
  implementation "androidx.activity:activity-ktx:1.9.0"
}
