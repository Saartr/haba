<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Возвращаемся в приложение…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f5f5f5; color:#121212; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         text-align:center; padding:24px; }
  @media (prefers-color-scheme: dark) { body { background:#121212; color:#fafafa; } }
  p { font-size:15px; line-height:1.5; margin:0; }
</style>
</head>
<body>
<p id="msg">Возвращаемся в приложение…</p>
<script>
// Страница возврата из OAuth vk. Единственная задача — отдать код обратно в
// мобильное приложение: redirect_uri в консоли провайдера может быть только
// обычным адресом, а не схемой haba:// или exp://.
//
// Адрес возврата приложение положило в state (base64url после префикса "app."),
// потому что заранее он неизвестен: в собранной версии это haba://, в Expo Go —
// exp://<хост-туннеля>/--/…
(function () {
  var q = new URLSearchParams(location.search);
  var state = q.get('state') || '';
  var PREFIX = 'app.';
  function fail(text) { document.getElementById('msg').textContent = text; }

  if (state.indexOf(PREFIX) !== 0) {
    fail('Эта страница открывается только при входе из приложения.');
    return;
  }
  var encoded = state.slice(PREFIX.length).split('.')[0];
  var target;
  try {
    var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    target = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  } catch (e) { target = null; }

  // Открытый редирект недопустим: уходим только в приложение, больше никуда.
  if (!target || !/^(haba|exp):\/\//.test(target)) {
    fail('Не удалось вернуться в приложение.');
    return;
  }
  var out = new URLSearchParams();
  ['code', 'state', 'device_id', 'error'].forEach(function (k) {
    var v = q.get(k);
    if (v) out.set(k, v);
  });
  location.replace(target + '?' + out.toString());
})();
</script>
</body>
</html>
